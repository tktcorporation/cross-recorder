name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Install shell test tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Lint
        run: pnpm lint

      - name: Lint native shell scripts
        run: pnpm lint:shell

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test native Linux capture script
        run: pnpm test:bats

      - name: Vite build
        run: pnpm build:vite

      - name: Agent adapter drift check
        run: pnpm agent-adapters:check
